<h1 class="text-center m-3">{{descripcion}}</h1>
<br>

<div class="m-3 table-responsive">
  <table class="table">
    <thead class="table-dark">
      <tr>
        <th scope="col">UBICACION</th>
        <th scope="col">CANTIDAD</th>
        <th scope="col"></th>
      </tr>
    </thead>
    <tbody id="bodytab">
      <tr *ngFor="let item of ubicaciones; let i = index">
        <td>{{item.ubicacion}}</td>
        <td><input class="form-control p-1" [(ngModel)]="item.uds" type="number" (input)="gettotal()"></td>
        <td> <button class="btn btn-danger" (click)="borrar(i)"><i class='bx bxs-x-circle bx-sm' ></i></button></td>
      </tr>
    </tbody>
  </table>
  <button class="btn btn-warning" (click)="addubicacion()"><i class='bx bx-plus-circle bx-sm'></i></button>
</div>

<div class="d-flex flex-column justify-content-center mt-3 ">
<p class="text-center fs-5">TOTAL</p>
<input class="form-control p-1 text-center fs-5" disabled [value]="total" >
</div>

<div class="d-flex justify-content-center">
  <button class="btn btn-secondary m-3" (click)="dismiss(false)"><i class='bx bx-x bx-sm' ></i></button>
  <button class="btn m-3" [ngClass]="{'btn-success': isGreen, 'btn-warning': !isGreen}" (click)="guardarcalculoinv()" [disabled]="ubicaciones.length==0"><i class='bx bx-check bx-sm'></i></button>
</div>
